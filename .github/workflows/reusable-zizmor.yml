# SPDX-License-Identifier: MIT
name: Reusable zizmor
on:
  workflow_call:
    inputs:
      version:
        description: zizmor version to install.
        type: string
        # renovate: datasource=pypi depName=zizmor
        default: 1.30.1
      working-directory:
        description: Directory the tool runs in, relative to the repository root.
        type: string
        default: .
permissions: {}
concurrency:
  group: zizmor-${{ inputs.working-directory }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  zizmor:
    name: Zizmor
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          cache: false
          install: false
      - name: zizmor
        working-directory: ${{ inputs.working-directory }}
        env:
          TOOL_VERSION: ${{ inputs.version }}
        run: mise exec zizmor@"$TOOL_VERSION" -- zizmor --persona=pedantic .github/workflows
