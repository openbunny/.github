# SPDX-License-Identifier: MIT
name: Reusable release-please
on:
  workflow_call:
    inputs:
      config-file:
        description: Release-please manifest-mode config path.
        type: string
        default: release-please-config.json
      manifest-file:
        description: Release-please manifest path.
        type: string
        default: .release-please-manifest.json
      signoff:
        description: Sign-off identity for the release commit.
        type: string
        default: ""
    secrets:
      token:
        description: PAT for the release PR and tag; falls back to GITHUB_TOKEN.
        required: false
permissions: {}
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-please:
    name: Release Please
    permissions:
      contents: write # pushes the release commit and tag
      pull-requests: write # opens and updates the release PR
      issues: write # comments release links on issues the release closes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Manifest mode: the config file and the manifest carry release-as,
      # bump-minor-pre-major, draft and the changelog path. Passing
      # release-type here instead would switch to simple mode and ignore
      # both files.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          signoff: ${{ inputs.signoff }}
          # A real-user PAT makes the release PR and tag come from a user
          # instead of github-actions[bot], so the PR's CI runs and the
          # pushed tag triggers the release workflow (a GITHUB_TOKEN-created
          # tag does not).
          token: ${{ secrets.token || secrets.GITHUB_TOKEN }}
