# SPDX-License-Identifier: MIT
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Check
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-check.yml # zizmor: ignore[self-repository] local reusable, versioned by commit
    with:
      runner: ubuntu-latest
  pinned-runner:
    name: Pinned runner ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-26]
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-check.yml # zizmor: ignore[self-repository] local reusable, versioned by commit
    with:
      runner: ${{ matrix.runner }}
      tools: just
      recipe: runner-probe
  renovate-preset:
    name: Renovate preset
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-check.yml # zizmor: ignore[self-repository] local reusable, versioned by commit
    with:
      tools: just
      recipe: renovate-preset
  reuse:
    name: REUSE
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-reuse.yml # zizmor: ignore[self-repository] local reusable, versioned by commit
  gitleaks:
    name: Gitleaks
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-gitleaks.yml # zizmor: ignore[self-repository] local reusable, versioned by commit
  zizmor:
    name: Zizmor
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-zizmor.yml # zizmor: ignore[self-repository] local reusable, versioned by commit
  gitleaks-foreign-mise:
    name: Gitleaks with a caller mise.toml
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-gitleaks.yml # zizmor: ignore[self-repository] local reusable, versioned by commit
    with:
      working-directory: fixtures/caller-without-tools
  zizmor-foreign-mise:
    name: Zizmor with a caller mise.toml
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-zizmor.yml # zizmor: ignore[self-repository] local reusable, versioned by commit
    with:
      working-directory: fixtures/caller-without-tools
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-dco.yml # zizmor: ignore[self-repository] local reusable, versioned by commit
