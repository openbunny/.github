# SPDX-License-Identifier: MIT
name: Reusable Scorecard
on:
  workflow_call:
    inputs:
      publish:
        description: Publish results to the OpenSSF API; true requires a public repository.
        type: boolean
        default: false
permissions: {}
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scorecard:
    name: Scorecard
    permissions:
      contents: read
      id-token: write # mints the OIDC token scorecard-action uses to sign published results
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.json
          results_format: json
          publish_results: ${{ inputs.publish }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.json
          retention-days: 30
