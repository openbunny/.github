# SPDX-License-Identifier: MIT
name: Reusable Gitleaks
on:
  workflow_call:
    inputs:
      version:
        description: gitleaks version to install.
        type: string
        # renovate: datasource=github-releases depName=gitleaks/gitleaks
        default: 8.30.1
      working-directory:
        description: Directory the tool runs in, relative to the repository root.
        type: string
        default: .
permissions: {}
concurrency:
  group: gitleaks-${{ inputs.working-directory }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gitleaks:
    name: Gitleaks
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          cache: false
          install: false
      - name: gitleaks
        working-directory: ${{ inputs.working-directory }}
        env:
          TOOL_VERSION: ${{ inputs.version }}
        run: mise exec gitleaks@"$TOOL_VERSION" -- gitleaks git --redact -v
